name: Build Windows desktop exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          # package-lock.json 是在 Linux 上產生的，rollup 的 optional
          # dependencies（平台專屬原生模組）鎖定跨平台不可攜，是 npm 已知的
          # bug（npm/cli#4828）。光把 npm ci 換成 npm install 不夠——只要
          # lockfile 還在，npm install 一樣會照著它已經鎖住的套件清單走，
          # 不會補抓 Windows 專屬那份。要照 npm 官方錯誤訊息講的，把
          # lockfile 一起砍掉，npm install 才會在當下平台重新完整解析。
          # （node_modules 在 CI 是全新 checkout，本來就不會殘留，不用另外砍）
          Remove-Item -ErrorAction SilentlyContinue package-lock.json
          npm install
          npm run build
          # 桌面單一 process 模式：前端跟後端同源，API_BASE 留空走相對路徑
          # （docker-compose 部署是兩個容器兩個 port，config.json 才需要指定 API_BASE）
          echo '{"API_BASE": ""}' > dist/config.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + PyInstaller deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Copy built frontend into backend bundle
        run: Copy-Item -Recurse frontend/dist backend/frontend_dist

      - name: Build exe with PyInstaller
        working-directory: backend
        run: >
          pyinstaller --onefile --name UnifiAccessAttendance --icon NONE
          --add-data "frontend_dist;frontend_dist"
          --collect-all uvicorn
          --hidden-import app.main
          desktop_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: UnifiAccessAttendance-windows-x64
          path: backend/dist/UnifiAccessAttendance.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/UnifiAccessAttendance.exe
