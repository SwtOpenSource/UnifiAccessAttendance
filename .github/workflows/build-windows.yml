name: Build Windows desktop exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # 桌面單一 process 模式：前端跟後端同源，API_BASE 留空走相對路徑
          # （docker-compose 部署是兩個容器兩個 port，config.json 才需要指定 API_BASE）
          echo '{"API_BASE": ""}' > dist/config.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + PyInstaller deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Copy built frontend into backend bundle
        run: Copy-Item -Recurse frontend/dist backend/frontend_dist

      - name: Build exe with PyInstaller
        working-directory: backend
        run: >
          pyinstaller --onefile --name UnifiAccessAttendance --icon NONE
          --add-data "frontend_dist;frontend_dist"
          --collect-all uvicorn
          --hidden-import app.main
          desktop_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: UnifiAccessAttendance-windows-x64
          path: backend/dist/UnifiAccessAttendance.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/UnifiAccessAttendance.exe
